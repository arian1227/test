name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build libkmod.so and classes2.dex
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kmod-build
          path: out/
